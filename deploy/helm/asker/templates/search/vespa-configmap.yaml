{{- /*
Vespa application-package ConfigMap (ADR-014 §4). Carries a multi-group,
streaming-mode services.xml generated from the grouping values, plus a deploy
note. A follow-up deploy Job (vespa/deploy.sh-equivalent) mounts this and POSTs
the package to the config server's /application/v2/.../prepareandactivate; this
wave ships the package + topology so the Job is a thin wrapper (see the README /
build report — the actual Job is an acceptable follow-up).

The generated services.xml mirrors vespa/services.xml (one container cluster +
one streaming content cluster id="asker") but expands the content cluster into
`vespa.groups` GROUPS of `vespa.nodesPerGroup` nodes each (spec §2.7): a hot
tenant's streaming query scans exactly one group. redundancy defaults to the
group count so each group holds a full copy.

The schema (doc.sd) is NOT inlined here — it lives at vespa/app/schemas/doc.sd
(committed, with @EMBEDDING_DIM@/@CLIP_DIM@ tokens the deploy step substitutes).
The deploy Job assembles services.xml (from this ConfigMap) + the committed
schema into the package zip, exactly as vespa/deploy.sh stages it today.

Gated behind `vespa.deploy` (default false).
*/ -}}
{{- $vespa := .Values.vespa | default dict -}}
{{- if $vespa.deploy -}}
{{- $groups := int ($vespa.groups | default 1) -}}
{{- $nodesPerGroup := int ($vespa.nodesPerGroup | default 1) -}}
{{- $redundancy := int ($vespa.redundancy | default $groups) -}}
{{- $vespaName := include "asker.vespa.name" . -}}
{{- $headless := printf "%s-headless" $vespaName -}}
{{- $heap := $vespa.containerJvmOptions | default "-Xms256m -Xmx768m" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-app" $vespaName }}
  labels:
    {{- include "asker.vespa.labels" . | nindent 4 }}
data:
  # Multi-group streaming content cluster (spec §2.7). Host aliases vespa-0..N map
  # to the StatefulSet pods' stable headless DNS; the deploy Job supplies the
  # matching hosts.xml (or uses Vespa's flat-node hosts) — see DEPLOY_NOTES.txt.
  services.xml: |
    <?xml version="1.0" encoding="utf-8" ?>
    <!-- Generated by the asker Helm chart (search wave). Streaming-mode,
         {{ $groups }} group(s) x {{ $nodesPerGroup }} node(s). -->
    <services version="1.0">
        <container id="default" version="1.0">
            <search/>
            <document-api/>
            <nodes>
                <jvm options="{{ $heap }}"/>
                <node hostalias="vespa-0"/>
            </nodes>
        </container>
        <content id="asker" version="1.0">
            <redundancy>{{ $redundancy }}</redundancy>
            <documents>
                <document type="doc" mode="streaming"/>
            </documents>
            <group>
            {{- range $g := until $groups }}
                <group name="group-{{ $g }}" distribution-key="{{ $g }}">
                {{- range $n := until $nodesPerGroup }}
                    {{- $ordinal := add (mul $g $nodesPerGroup) $n }}
                    <node hostalias="vespa-{{ $ordinal }}" distribution-key="{{ $ordinal }}"/>
                {{- end }}
                </group>
            {{- end }}
            </group>
        </content>
    </services>
  DEPLOY_NOTES.txt: |
    Asker Vespa application package — deploy notes (search wave, ADR-014 §4).

    Topology: {{ $groups }} content group(s) x {{ $nodesPerGroup }} node(s) per
    group => {{ include "asker.vespa.replicas" . }} content node(s); redundancy
    {{ $redundancy }}. StatefulSet: {{ $vespaName }}; headless DNS: {{ $headless }}.

    The application package is NOT auto-deployed by this chart. A follow-up Job
    (or `make`/runbook step) runs the vespa/deploy.sh flow against the config
    server, assembling:
      - services.xml  : this ConfigMap key (the multi-group topology above)
      - hosts.xml     : maps hostalias vespa-<ordinal> ->
                        {{ $vespaName }}-<ordinal>.{{ $headless }}
      - schemas/doc.sd: the committed vespa/app/schemas/doc.sd, with
                        @EMBEDDING_DIM@/@CLIP_DIM@ substituted from config.* values
                        ({{ .Values.config.embeddingDim }}/{{ .Values.config.clipDim }}).
    then POSTs the zip to:
      http://vespa:19071/application/v2/tenant/default/prepareandactivate
    (the in-cluster config-server address; vespa/deploy.sh uses
    VESPA_CFG_URL/VESPA_QUERY_URL — point them at the "vespa" Service).
{{- end }}
