{{- /*
ServiceAccounts for the stateless app tier.

Identity is the anchor M4 hangs default-deny NetworkPolicy + mTLS / workload
identity off (ADR-009: the internal trust boundary becomes enforced, not just
topological). Every workload sets serviceAccountName via the chart-skeleton
helper asker.serviceAccountNameFor (edge wave: gateway/web; stateless-workloads
wave: the other seven), which resolves to:
  - services.<svc>.serviceAccount.name        (when set), else
  - asker.serviceAccountName  ==  <fullname>   (the chart-wide default SA).

So this template renders exactly the SA names that helper can return:
  1. the chart-wide SA (asker.serviceAccountName) — the default every service
     falls back to; and
  2. one SA per service that sets an explicit services.<svc>.serviceAccount.name
     (a deduped set, in case several share one name).
Rendering per-service-named SAs only when requested keeps the default a single
shared SA (the helm-create pattern the helper encodes) while still letting an
operator give a service its own identity for tighter NetworkPolicy/mTLS scoping.

Gated by the chart-wide serviceAccount.create toggle; automount and annotations
come from the serviceAccount.* values block.
*/ -}}
{{- if .Values.serviceAccount.create }}
{{- $root := . -}}
{{- $automount := .Values.serviceAccount.automountServiceAccountToken -}}
{{- if kindIs "invalid" $automount }}{{- $automount = false -}}{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "asker.serviceAccountName" . }}
  labels:
    {{- include "asker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The internal RPC mesh carries tenant identity in gRPC metadata (ADR-009), not a
# mounted SA token; default off (overridable via serviceAccount.* values).
automountServiceAccountToken: {{ $automount }}
{{- /* Per-service SAs: only for services that request their own name. */ -}}
{{- $components := list "gateway" "web" "query" "ingest" "enrich" "index-writer" "connector-hub" "control-plane" "clip" -}}
{{- $seen := dict -}}
{{- range $component := $components }}
{{- $cfg := index $root.Values.services $component | default dict -}}
{{- $custom := "" -}}
{{- if and $cfg $cfg.serviceAccount $cfg.serviceAccount.name -}}
{{- $custom = $cfg.serviceAccount.name -}}
{{- end -}}
{{- if and $custom (not (hasKey $seen $custom)) }}
{{- $_ := set $seen $custom true }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $custom }}
  labels:
    {{- include "asker.serviceLabels" (list $root $component) | nindent 4 }}
  {{- with $root.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $automount }}
{{- end }}
{{- end }}
{{- end }}
