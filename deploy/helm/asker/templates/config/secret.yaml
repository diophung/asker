{{- /*
============================================================================
  DEV-ONLY Secret — REPLACE WITH VAULT (or external-secrets) IN PRODUCTION.
============================================================================
These literals mirror the dev credentials hardcoded in
deploy/compose/docker-compose.yml (MinIO asker-minio/asker-minio-secret,
Postgres asker/asker, Keycloak admin/admin). They exist so the chart renders a
complete, self-contained stack for kind/k3d CI (M4 exit criteria) without a
secrets backend.

PRODUCTION (ADR-009 trust boundary hardening): set secrets.strategy to "vault"
or "external" and provision a Secret named {{ include "asker.secretName" . }}
out-of-band (Vault Agent injector / External Secrets Operator syncing from
Vault). The app workloads reference that fixed name regardless of strategy, so
flipping the strategy needs no workload change. NEVER ship these literals to a
real cluster.

DATABASE_URL embeds the Postgres password, so it lives here (Secret), not in the
shared ConfigMap.
*/ -}}
{{- if eq .Values.secrets.strategy "chart" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "asker.secretName" . }}
  labels:
    {{- include "asker.labels" . | nindent 4 }}
    asker.dev/secret-source: chart-dev-literals
  annotations:
    # Loud marker so this is never mistaken for a prod-managed secret.
    asker.dev/warning: "DEV-ONLY credentials from the Helm chart. Replace with Vault/external-secrets in production (secrets.strategy=vault|external)."
type: Opaque
stringData:
  # --- MinIO (blob store) — dev-only -----------------------------------------
  MINIO_ACCESS_KEY: {{ .Values.secrets.dev.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.dev.minioSecretKey | quote }}
  # --- Postgres (control-plane token vault metadata) — dev-only --------------
  POSTGRES_USER: {{ .Values.secrets.dev.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dev.postgresPassword | quote }}
  # control-plane reads DATABASE_URL directly (compose:
  # postgres://asker:asker@postgres:5432/asker). Composed from config.postgres*
  # plus the dev credentials above.
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%v/%s" .Values.secrets.dev.postgresUser .Values.secrets.dev.postgresPassword .Values.config.postgresHost .Values.config.postgresPort .Values.config.postgresDb | quote }}
  # --- Keycloak bootstrap admin — dev-only -----------------------------------
  KEYCLOAK_ADMIN_USER: {{ .Values.secrets.dev.keycloakAdminUser | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.dev.keycloakAdminPassword | quote }}
{{- end }}
