# Asker dev stack (M0). Dev-only credentials throughout — never reuse in production.
# Bring up with `make dev-up` (compose up --wait gates on the healthchecks below,
# then vespa/deploy.sh pushes the Vespa application package).
name: asker

# Connector OAuth (dev): point every provider's authorize/token endpoints at the
# fake-oauth service (auto-consents, issues dev tokens). Real deployments set
# ASKER_OAUTH_<P>_CLIENT_ID/_SECRET to a registered app and DROP the *_URL
# overrides so the real provider endpoints are used (see docs/oauth.md). Shared by
# the gateway (code exchange) and connector-hub (token refresh).
# ASKER_SAFEHTTP_ALLOW_PRIVATE relaxes the SSRF guard so the in-network fake-oauth
# host is reachable — DEV/CI ONLY, never production (the metadata IP stays blocked).
# AUTH_URL is BROWSER-facing (the user's host browser is redirected there), so it
# uses the host-published address localhost:9500; TOKEN_URL is GATEWAY/HUB-facing
# (server-side code exchange + refresh), so it uses the in-network fake-oauth:9500.
# Same split as OIDC_ISSUER (localhost:8081) vs OIDC_JWKS_URL (keycloak:8080).
x-oauth-env: &oauth-env
  ASKER_SAFEHTTP_ALLOW_PRIVATE: "1" # dev-only: reach the in-network fake-oauth
  # Google: defaults are the dev fake provider. To connect a REAL Gmail account,
  # set these four in deploy/compose/.env (gitignored) — see docs/oauth.md. The
  # real-Google values for the two URLs are commented in that .env block ready to
  # uncomment; CLIENT_ID/SECRET come from your Google Cloud OAuth client.
  ASKER_OAUTH_GOOGLE_CLIENT_ID: "${ASKER_OAUTH_GOOGLE_CLIENT_ID:-dev-google-client}"
  ASKER_OAUTH_GOOGLE_CLIENT_SECRET: "${ASKER_OAUTH_GOOGLE_CLIENT_SECRET:-dev-google-secret}"
  ASKER_OAUTH_GOOGLE_AUTH_URL: "${ASKER_OAUTH_GOOGLE_AUTH_URL:-http://localhost:9500/google/authorize}"
  ASKER_OAUTH_GOOGLE_TOKEN_URL: "${ASKER_OAUTH_GOOGLE_TOKEN_URL:-http://fake-oauth:9500/google/token}"
  ASKER_OAUTH_MICROSOFT_CLIENT_ID: "dev-microsoft-client" # dev-only
  ASKER_OAUTH_MICROSOFT_CLIENT_SECRET: "dev-microsoft-secret" # dev-only
  ASKER_OAUTH_MICROSOFT_AUTH_URL: "http://localhost:9500/microsoft/authorize"
  ASKER_OAUTH_MICROSOFT_TOKEN_URL: "http://fake-oauth:9500/microsoft/token"
  ASKER_OAUTH_SLACK_CLIENT_ID: "dev-slack-client" # dev-only
  ASKER_OAUTH_SLACK_CLIENT_SECRET: "dev-slack-secret" # dev-only
  ASKER_OAUTH_SLACK_AUTH_URL: "http://localhost:9500/slack/authorize"
  ASKER_OAUTH_SLACK_TOKEN_URL: "http://fake-oauth:9500/slack/token"
  ASKER_OAUTH_ATLASSIAN_CLIENT_ID: "dev-atlassian-client" # dev-only
  ASKER_OAUTH_ATLASSIAN_CLIENT_SECRET: "dev-atlassian-secret" # dev-only
  ASKER_OAUTH_ATLASSIAN_AUTH_URL: "http://localhost:9500/atlassian/authorize"
  ASKER_OAUTH_ATLASSIAN_TOKEN_URL: "http://fake-oauth:9500/atlassian/token"

services:
  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *oauth-env
      # Public base used to build the OAuth redirect_uri (<base>/v1/oauth/callback)
      # and the post-callback redirect back to the web UI. Override in .env (e.g.
      # to http://127.0.0.1:8080 if localhost resolves to IPv6 on your machine);
      # the registered redirect URI at Google must match this base exactly.
      GATEWAY_PUBLIC_URL: "${GATEWAY_PUBLIC_URL:-http://localhost:8080}"
      WEB_APP_URL: "http://localhost:13001"
      GATEWAY_ADDR: ":8080"
      OIDC_ISSUER: "http://localhost:8081/realms/asker"
      # Token `iss` is the host-visible URL (KC_HOSTNAME), but the gateway fetches
      # JWKS over the compose network — hence explicit issuer + JWKS instead of discovery.
      OIDC_JWKS_URL: "http://keycloak:8080/realms/asker/protocol/openid-connect/certs"
      OIDC_AUDIENCE: "asker-web"
      QUERY_GRPC_ADDR: "dns:///query:9200"
      CONTROL_PLANE_GRPC_ADDR: "dns:///control-plane:9100"
      HUB_HTTP_URL: "http://connector-hub:9300"
      REDIS_ADDR: "redis:6379"
      RATE_LIMIT_PER_MINUTE: "600"
      # Web UI origin(s). Both host forms because macOS resolves `localhost` to
      # IPv6 (::1) first and the web container binds IPv4 (127.0.0.1) — see the
      # web service note below for why the host port is 13001, not 3000.
      CORS_ALLOWED_ORIGINS: "http://localhost:13001,http://127.0.0.1:13001"
      MAX_UPLOAD_MB: "32"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # Distroless image (no shell): the binary self-probes /healthz.
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  control-plane:
    build:
      context: ../..
      dockerfile: services/control-plane/Dockerfile
    environment:
      CONTROL_PLANE_ADDR: ":9100"
      CONTROL_PLANE_HEALTH_ADDR: ":9101"
      DATABASE_URL: "postgres://asker:asker@postgres:5432/asker"
      KEK_FILE: "/keys/kek.bin"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    volumes:
      - kek-keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/control-plane", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  connector-hub:
    build:
      context: ../..
      dockerfile: services/connector-hub/Dockerfile
    environment:
      <<: *oauth-env
      HUB_ADDR: ":9300"
      HUB_HEALTH_ADDR: ":9301"
      HUB_WEBHOOK_BASE: "http://connector-hub:9300"
      CONTROL_PLANE_GRPC_ADDR: "dns:///control-plane:9100"
      KAFKA_BROKERS: "redpanda:9092"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "asker-minio" # dev-only
      MINIO_SECRET_KEY: "asker-minio-secret" # dev-only
      MINIO_USE_SSL: "false"
      BLOB_BUCKET: "asker-blobs"
      KEK_FILE: "/keys/kek.bin"
      CONNECTOR_SYNC_INTERVAL: "30s"
      SCHEDULER_TICK: "10s"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    volumes:
      - kek-keys:/keys
    depends_on:
      control-plane:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/connector-hub", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ingest:
    build:
      context: ../..
      dockerfile: services/ingest/Dockerfile
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      REDIS_ADDR: "redis:6379"
      INGEST_HEALTH_ADDR: ":9501"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ingest", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  enrich:
    build:
      context: ../..
      dockerfile: services/enrich/Dockerfile
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      TEI_URL: "http://tei:80"
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      ENRICH_HEALTH_ADDR: ":9601"
      # Media pipeline (M3, used by wave-1 media handlers): CLIP embeddings, and
      # the hub's internal decrypt/encrypt endpoint for original media + thumbnails.
      CLIP_URL: "http://clip:9800"
      CLIP_DIM: ${CLIP_DIM:-512}
      HUB_MEDIA_URL: "http://connector-hub:9300"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    volumes:
      - enrich-hf-cache:/home/nonroot/.cache/huggingface # whisper-tiny weights (M3)
    depends_on:
      redpanda:
        condition: service_healthy
      tei:
        condition: service_healthy
      clip:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9601/healthz', timeout=2).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  index-writer:
    build:
      context: ../..
      dockerfile: services/index-writer/Dockerfile
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      VESPA_URL: "http://vespa:8080"
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      CLIP_DIM: ${CLIP_DIM:-512}
      INDEX_WRITER_HEALTH_ADDR: ":9701"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      redpanda:
        condition: service_healthy
      vespa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/index-writer", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  query:
    build:
      context: ../..
      dockerfile: services/query/Dockerfile
    environment:
      QUERY_ADDR: ":9200"
      QUERY_HEALTH_ADDR: ":9201"
      VESPA_URL: "http://vespa:8080"
      TEI_URL: "http://tei:80"
      REDIS_ADDR: "redis:6379"
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      # CLIP text->image arm (M3, ADR-013); degrades gracefully if clip is down.
      CLIP_URL: "http://clip:9800"
      CLIP_DIM: ${CLIP_DIM:-512}
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      vespa:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/query", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  clip:
    # CLIP model service (M3, ADR-013): one open_clip model serves both the text
    # and image encoders so text->image queries and image embeddings share a
    # space. Dev/CI use ViT-B/32 (small). First start loads/downloads the model.
    build:
      context: ../../services/clip
      dockerfile: Dockerfile
    environment:
      CLIP_MODEL: ${CLIP_MODEL:-ViT-B-32}
      CLIP_PRETRAINED: ${CLIP_PRETRAINED:-openai}
      CLIP_PORT: ":9800"
    volumes:
      # Mount at the image's nonroot HOME (HOME=/home/nonroot, HF_HOME under it):
      # open_clip writes weights there, not /root/.cache. Without this the cache
      # never persists and weights re-download on every container restart.
      - clip-cache:/home/nonroot/.cache # open_clip model weights cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9800/health', timeout=2).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 30
      # Model download + load on first boot.
      start_period: 10m

  fake-gmail:
    # Dev/CI only: local Gmail API fake (ADR-008). Admin API is unauthenticated
    # by design — bound to 127.0.0.1 ONLY so the host e2e driver can seed it;
    # NEVER expose beyond the local machine.
    build:
      context: ../..
      dockerfile: tools/fake-gmail/Dockerfile
    ports:
      - "127.0.0.1:9400:9400"
    environment:
      FAKE_GMAIL_ADDR: ":9400"
    healthcheck:
      test: ["CMD", "/fake-gmail", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  fake-oauth:
    # Dev/CI only: a standards-correct fake OAuth 2.0 authorization server that the
    # gateway (code exchange) and connector-hub (refresh) point every provider at.
    # It AUTO-CONSENTS — any caller gets a token for the configured subject — so it
    # is bound to 127.0.0.1 / the compose network ONLY; NEVER expose it. For Google
    # it issues "fake-gmail-token:<subject>" so the post-OAuth gmail sync reaches the
    # fake-gmail service end to end.
    build:
      context: ../..
      dockerfile: tools/fake-oauth/Dockerfile
    ports:
      - "127.0.0.1:9500:9500"
    environment:
      ADDR: ":9500"
      FAKE_OAUTH_SUBJECT: "alice@example.com" # dev default identity
    healthcheck:
      test: ["CMD", "/fake-oauth", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      # Self-contained npm build — context is web/ itself, not the repo root.
      context: ../../web
      dockerfile: Dockerfile
    ports:
      # Host port 13001, NOT the Next.js-default 3000: that port commonly collides
      # with another local dev app, and because macOS resolves `localhost` to IPv6
      # (::1) before IPv4 while this container binds IPv4 only, a squatter on
      # ::1:3000 would intercept the browser and break the Keycloak silent-SSO
      # flow ("Could not reach the identity provider"). 13001 sits with the other
      # host-facing UIs (Grafana 13000) and is collision-free. (Same rationale as
      # Postgres→15432, Redis→16379, Redpanda→19092 — ADR-003 §4.)
      - "127.0.0.1:13001:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: "http://localhost:8081"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin" # dev-only
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin" # dev-only
      # Dev-only: without a cgroup limit Keycloak sizes its heap as 70% of the
      # whole Docker VM. Cap it for shared dev machines.
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx400m"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/realm-asker.json:/opt/keycloak/data/import/realm-asker.json:ro
    healthcheck:
      # Image has bash but no curl/wget; health lives on management port 9000.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'HTTP/1.1 200' <&3
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  vespa:
    image: vespaengine/vespa:8
    environment:
      # Dev-only: the image refuses to start with <4GB available; a single-node
      # dev app runs fine smaller. Production sizing is an M4/M5 concern.
      VESPA_IGNORE_NOT_ENOUGH_MEMORY: "true"
      # Dev-only: shrink the config server heap (defaults to ~1.5G); the query
      # container heap is capped in vespa/app/services.xml for the same reason.
      VESPA_CONFIGSERVER_JVMARGS: "-Xms32m -Xmx256m"
    ports:
      - "127.0.0.1:8082:8080" # query + document API (alive only after app deploy via vespa/deploy.sh)
      - "127.0.0.1:19071:19071" # config server
    volumes:
      - vespa-var:/opt/vespa/var
      - vespa-logs:/opt/vespa/logs
    healthcheck:
      # Config-server health only: the query port comes alive after the application
      # package is deployed, which vespa/deploy.sh does AFTER `compose up --wait`.
      test: ["CMD", "curl", "-fsS", "http://localhost:19071/state/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  tei:
    # TEI publishes CPU images for linux/amd64 only; on Apple Silicon this runs
    # under Docker Desktop's Rosetta/QEMU emulation (works, but embeds slowly).
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    ports:
      - "127.0.0.1:8083:80"
    environment:
      # Override for CI with a small model: TEI_MODEL_ID=sentence-transformers/all-MiniLM-L6-v2
      MODEL_ID: ${TEI_MODEL_ID:-BAAI/bge-m3}
    # Default CMD is just --json-output; keep it and bound tokenization workers
    # (default = nproc = 18 here) plus warmup/runtime batch size — both spiked
    # memory enough to get the container OOM-killed on constrained dev machines.
    command:
      [
        "--json-output",
        "--tokenization-workers",
        "2",
        "--max-batch-tokens",
        "4096",
        "--max-concurrent-requests",
        "32",
      ]
    volumes:
      - tei-cache:/data # HF model cache (HUGGINGFACE_HUB_CACHE=/data in the image)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      # First start downloads ~2.3GB for BAAI/bge-m3.
      start_period: 20m

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    environment:
      MINIO_ROOT_USER: "asker-minio" # dev-only
      MINIO_ROOT_PASSWORD: "asker-minio-secret" # dev-only
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:15432:5432" # host 5432 is taken on the dev machine
    environment:
      POSTGRES_USER: "asker" # dev-only
      POSTGRES_PASSWORD: "asker" # dev-only
      POSTGRES_DB: "asker"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asker -d asker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:16379:6379" # host 6379 is taken on the dev machine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v24.3.11
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      # Dev-only: Seastar otherwise sizes its upfront allocation from total VM
      # memory and gets OOM-killed on shared dev machines.
      - --memory 512M
      - --reserve-memory 0M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      # Schema registry stays on the compose network only (no host port published).
      - --schema-registry-addr internal://0.0.0.0:8081
    ports:
      - "127.0.0.1:19092:19092" # Kafka API, external listener (advertised as localhost:19092)
      - "127.0.0.1:9644:9644" # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  minio-data:
  redpanda-data:
  vespa-var:
  vespa-logs:
  tei-cache:
  # Shared dev KEK for envelope encryption (control-plane token vault +
  # connector-hub blob store). Vault replaces this in M4.
  kek-keys:
  clip-cache: # open_clip model weights (M3)
  enrich-hf-cache: # faster-whisper (whisper-tiny) weights (M3)
