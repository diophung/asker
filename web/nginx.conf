server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Docker's embedded DNS. Resolving the upstream hostnames through a `resolver`
    # plus a *variable* in proxy_pass defers name resolution from nginx STARTUP to
    # REQUEST time. With a literal `proxy_pass http://gateway:8080`, nginx resolves
    # the name when it loads config and exits(1) with "host not found in upstream"
    # if that container isn't up yet — a start-order race that left :13001 dead
    # while the rest of the stack came up healthy. Request-time resolution also
    # lets nginx survive an upstream container restart onto a new IP (re-resolved
    # every `valid=`). ipv6=off avoids a pointless AAAA lookup on this v4-only net.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable; cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Backend proxy: keep the SPA same-origin so the v2 UI's relative /v1
    # (gateway) and /kc (Keycloak) calls reach the in-network services — the
    # production analogue of the Vite dev proxy. DEV STACK ONLY.
    location /v1 {
        # Variable proxy_pass => request-time DNS (see resolver note above). With
        # no URI component nginx forwards the original $uri + $args verbatim, which
        # matches the old literal `proxy_pass http://gateway:8080;`.
        set $upstream_gateway gateway:8080;
        proxy_pass http://$upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 64m;
    }
    location /kc/ {
        # Strip the /kc prefix (/kc/realms/... -> /realms/...). Host is pinned to
        # KC_HOSTNAME so Keycloak issues tokens with iss=http://localhost:8081.
        # The rewrite reproduces the prefix-strip of the old `proxy_pass .../;`
        # form, which is unavailable once proxy_pass uses a variable. `break`
        # preserves the query string (critical for the OIDC ?response_type=code
        # redirect flow), and request-time DNS applies here too. NOTE: `set` MUST
        # precede the rewrite — `set` and `rewrite` share the rewrite phase, and
        # `... break` stops every rewrite-phase directive below it, so a `set`
        # placed after would never run (uninitialized var -> "invalid URL" 500).
        set $upstream_keycloak keycloak:8080;
        rewrite ^/kc/(.*)$ /$1 break;
        proxy_pass http://$upstream_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8081;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
