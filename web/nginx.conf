server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable; cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Backend proxy: keep the SPA same-origin so the v2 UI's relative /v1
    # (gateway) and /kc (Keycloak) calls reach the in-network services — the
    # production analogue of the Vite dev proxy. DEV STACK ONLY.
    location /v1 {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 64m;
    }
    location /kc/ {
        # Strip the /kc prefix (/kc/realms/... -> /realms/...). Host is pinned to
        # KC_HOSTNAME so Keycloak issues tokens with iss=http://localhost:8081.
        proxy_pass http://keycloak:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8081;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
