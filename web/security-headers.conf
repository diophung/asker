# Baseline security headers for the SPA, included per-location.
#
# `always` makes nginx emit them on error responses (4xx/5xx) too, not just
# 2xx/3xx. nginx's add_header does NOT inherit into a location that defines
# its own add_header, so every location that sets any header must include this
# file explicitly — see the note in nginx.conf.
#
# Content-Security-Policy is intentionally NOT here: it differs per location
# (the SPA needs a real policy for its document; proxied API responses get
# theirs from the gateway), so it is set at each site rather than shared.
#
# Strict-Transport-Security is also omitted: the dev stack is plain HTTP on
# 127.0.0.1, and HSTS would pin localhost to HTTPS in the developer's browser.
# It belongs at the TLS-terminating ingress in production.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
