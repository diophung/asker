name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Dedup superseded PR runs, but let every push to main run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile
      - name: buf lint + generated-code drift check
        run: |
          make tools
          (cd platform/proto && ../../bin/buf lint)
          make proto
          git diff --exit-code platform/proto/gen \
            || { echo "::error::platform/proto/gen is stale — run 'make proto' and commit"; exit 1; }

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests (race + coverage)
        run: make test
      - name: Enforce coverage floors
        run: bash tools/ci/coverage_gate.sh coverage.out

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all Go packages
        run: go build ./...
      - name: Build gateway image
        run: docker build -f services/gateway/Dockerfile -t asker-gateway:ci .
      - name: Scan gateway image (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: asker-gateway:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  enrich:
    name: enrich (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/enrich
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/enrich/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Test (pytest)
        run: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/platform/proto/gen/python

  web:
    name: web (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    env:
      # Small embedding model for CI speed; dev default stays BAAI/bge-m3.
      # EMBEDDING_DIM must match the model (ADR-005): bge-small = 384.
      TEI_MODEL_ID: BAAI/bge-small-en-v1.5
      EMBEDDING_DIM: "384"
    steps:
      - uses: actions/checkout@v4
      - name: Start the dev stack
        run: make dev-up
      - name: Run e2e smoke test
        run: make e2e-smoke
      - name: Dump compose logs
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=500 || true

  e2e-m1:
    name: e2e-m1
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    env:
      # Small embedding model for CI speed; dev default stays BAAI/bge-m3.
      # EMBEDDING_DIM must match the model (ADR-005): bge-small = 384.
      TEI_MODEL_ID: BAAI/bge-small-en-v1.5
      EMBEDDING_DIM: "384"
      # M1 exit criteria scale: 10K synthetic emails across 3 tenants.
      E2E_EMAIL_COUNT: "10000"
    steps:
      - uses: actions/checkout@v4
      - name: Start the dev stack
        run: make dev-up
      - name: Run M1 e2e + leakage suites
        run: make e2e-smoke && bash tools/e2e/m1-e2e.sh && bash tools/e2e/leakage.sh
      - name: Dump compose logs
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=500 || true
