name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Dedup superseded PR runs, but let every push to main run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile
      - name: buf lint + generated-code drift check
        run: |
          make tools
          (cd platform/proto && ../../bin/buf lint)
          make proto
          git diff --exit-code platform/proto/gen \
            || { echo "::error::platform/proto/gen is stale. Run 'make proto' and commit. If the ONLY diff is the 'Protobuf Python Version' header, do NOT commit it — the buf remote plugin pin in platform/proto/buf.gen.yaml and 'protobuf==' in services/enrich/requirements.txt must move together; committing gencode newer than the pinned runtime breaks the enrich worker at import."; exit 1; }
      - name: Helm lint + kubeconform (chart) + observability artifacts
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          go install github.com/yannh/kubeconform/cmd/kubeconform@latest
          helm lint deploy/helm/asker
          KC="$(go env GOPATH)/bin/kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.29.0 -summary"
          for vals in "" "-f deploy/helm/asker/values-dev.yaml" "-f deploy/helm/asker/values-ci.yaml"; do
            helm template asker deploy/helm/asker $vals | $KC
          done
          # M5: the opt-in observability path must also render + validate.
          helm template asker deploy/helm/asker --set observability.enabled=true | $KC
          # M5: the committed Grafana dashboards (JSON) + Prometheus alert rules
          # ship in the chart; guard against metric-name drift / broken JSON.
          for f in deploy/helm/asker/files/observability/grafana/dashboards/*.json; do
            python3 -m json.tool "$f" >/dev/null && echo "dashboard JSON OK: $f"
          done
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.1.0/prometheus-3.1.0.linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /tmp prometheus-3.1.0.linux-amd64/promtool
          /tmp/promtool check rules deploy/helm/asker/files/observability/prometheus/rules/*.rules.yml

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests (race + coverage)
        run: make test
      - name: Enforce coverage floors
        run: bash tools/ci/coverage_gate.sh coverage.out

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all Go packages
        run: go build ./...
      - name: Build gateway image
        run: docker build -f services/gateway/Dockerfile -t asker-gateway:ci .
      - name: Scan gateway image (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: asker-gateway:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  enrich:
    name: enrich (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/enrich
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/enrich/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Test (pytest)
        run: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/platform/proto/gen/python

  web:
    name: web (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    env:
      # Small embedding model for CI speed; dev default stays BAAI/bge-m3.
      # EMBEDDING_DIM must match the model (ADR-005): bge-small = 384.
      TEI_MODEL_ID: BAAI/bge-small-en-v1.5
      EMBEDDING_DIM: "384"
      CLIP_DIM: "512"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # make dev-up builds 11 images + pulls TEI/clip-torch/whisper, which fills
        # the runner's / past Vespa's 80% disk limit -> Vespa feed-blocks (HTTP 507)
        # and every feed fails. Reclaim the ~25GB of preinstalled toolchains first.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - name: Start the dev stack
        run: make dev-up
      - name: Run e2e smoke test
        run: make e2e-smoke
      - name: Dump compose logs
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=500 || true

  e2e-m1:
    name: e2e-m1
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    env:
      # Small embedding model for CI speed; dev default stays BAAI/bge-m3.
      # EMBEDDING_DIM must match the model (ADR-005): bge-small = 384.
      TEI_MODEL_ID: BAAI/bge-small-en-v1.5
      EMBEDDING_DIM: "384"
      CLIP_DIM: "512"
      # M1 exit criteria scale: 10K synthetic emails across 3 tenants.
      E2E_EMAIL_COUNT: "10000"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # See e2e-smoke: reclaim disk so Vespa does not feed-block (HTTP 507).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - name: Start the dev stack
        run: make dev-up
      - name: Run M1 e2e + leakage suites
        run: make e2e-smoke && bash tools/e2e/m1-e2e.sh && bash tools/e2e/leakage.sh
      - name: Dump compose logs
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=500 || true

  e2e-m3-media:
    name: e2e-m3-media
    runs-on: ubuntu-latest
    needs: [build]
    # Non-blocking: OCR/thumbnail enrichment is consistently absent on GitHub
    # runners (CLIP works) — a functional env gap tracked in issue #7. Runs for
    # signal but does not gate the workflow until that is debugged hands-on.
    continue-on-error: true
    # Heavy ML images (clip/torch, enrich/whisper+ffmpeg+tesseract) + first-run
    # model downloads (CLIP ViT-B/32, whisper-tiny) — allow generous time.
    timeout-minutes: 75
    env:
      TEI_MODEL_ID: BAAI/bge-small-en-v1.5
      EMBEDDING_DIM: "384"
      CLIP_DIM: "512"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # Heavy ML images make this the tightest job; reclaim the preinstalled
        # toolchains too (not just docker images) so Vespa does not feed-block.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - name: Start the dev stack
        run: make dev-up
      - name: Run M3 media exit suite
        run: make e2e-m3-media
      - name: Dump compose logs
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=500 || true

  e2e-gdpr:
    name: e2e-gdpr
    runs-on: ubuntu-latest
    needs: [build]
    # Non-blocking: the upload->blob/DEK path produces no blob/DEK on GitHub
    # runners though docs index fine — a functional env gap tracked in issue #6.
    # Runs for signal but does not gate the workflow until debugged hands-on.
    continue-on-error: true
    timeout-minutes: 40
    env:
      # Small embedding model for CI speed (mirrors the other e2e jobs).
      TEI_MODEL_ID: BAAI/bge-small-en-v1.5
      EMBEDDING_DIM: "384"
      CLIP_DIM: "512"
      # Async ingest (upload -> blob/DEK -> embed -> index) is slower on a loaded
      # runner than the script's 300s default; give it more room so the
      # precondition (DEK + blob present, searchable) doesn't race the pipeline.
      WAIT_SECS: "600"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # See e2e-smoke: reclaim disk so Vespa does not feed-block (HTTP 507).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - name: Start the dev stack
        run: make dev-up
      # The M6 GDPR per-tenant delete drill: seed a tenant's docs/blobs/token,
      # DELETE /v1/me/data, assert the cascade purged every store (search 0 hits,
      # blob prefix gone, token gone, DEK crypto-shredded) AND a second tenant is
      # untouched. Destructive by design (erases its test tenant), so it runs in a
      # dedicated job on a fresh stack — not alongside the leakage/m1 suites.
      - name: Run M6 GDPR delete drill
        run: make e2e-smoke && make e2e-gdpr
      - name: Dump compose logs
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=500 || true
