[project]
name = "asker-enrich"
version = "0.1.0"
description = "Asker enrich worker: docs.chunked -> TEI embeddings -> docs.enriched (ADR-007)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    # assert is how pytest works; tests are in-scope for ruff.
    "S101",
]

[tool.ruff.lint.isort]
known-first-party = ["enrich", "asker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The committed protobuf gencode lives in platform/proto/gen/python; the
# container sets the same path via PYTHONPATH.
pythonpath = [".", "../../platform/proto/gen/python"]
