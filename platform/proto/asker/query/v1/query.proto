// Internal query API: gateway -> query service.
//
// The tenant is NEVER a request field: it travels in gRPC metadata installed
// by the platform/tenancy interceptors, which the query service requires on
// every call. A request without a tenant context is rejected.
syntax = "proto3";

package asker.query.v1;

import "asker/v1/document.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/asker/asker/platform/proto/gen/go/asker/query/v1;queryv1";

// QueryService executes tenant-scoped searches against the index.
service QueryService {
  // Search runs a hybrid (keyword + vector) search over the calling tenant's
  // documents, with graceful degradation to keyword-only under failure/load.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Count returns how many documents are currently indexed (searchable) for the
  // calling tenant — the live "indexed" figure the Settings indexing-progress
  // view compares against the connectors' emitted count. Tenant-scoped via the
  // streaming group, like Search.
  rpc Count(CountRequest) returns (CountResponse);
}

message CountRequest {}

message CountResponse {
  // indexed is the tenant's document count in the search index.
  int64 indexed = 1;
}

// SearchMode selects the retrieval strategy.
enum SearchMode {
  SEARCH_MODE_UNSPECIFIED = 0; // treated as HYBRID
  HYBRID = 1; // keyword + vector blend (default)
  KEYWORD = 2; // keyword only
  VECTOR = 3; // vector only
}

message SearchRequest {
  // Raw user query. Inline filters (from:alice, type:email, before:/after:)
  // are extracted by query understanding before retrieval.
  string query = 1;
  // Optional structured filters; combined with extracted inline filters.
  repeated asker.v1.DocType doc_types = 2;
  google.protobuf.Timestamp from_date = 3;
  google.protobuf.Timestamp to_date = 4;
  // Participant filter (sender/attendee handle or email substring).
  string participant = 5;
  // Page size; default 20, max 100.
  int32 limit = 6;
  int32 offset = 7;
  SearchMode mode = 8;
  // debug, when true, asks the server to include per-hit feature contributions
  // (Hit.features) for observability. The gateway sets it from ?debug=1; it
  // never affects ranking, only what is reported.
  bool debug = 9;
}

message SearchResponse {
  repeated Hit hits = 1;
  // Total matching documents (tenant-scoped).
  int64 total = 2;
  // Degradation applied: "" (none), "keyword-only" (vector path skipped).
  string degraded = 3;
  int64 took_ms = 4;
  // True when served from the result cache.
  bool cached = 5;
}

message Hit {
  string doc_id = 1;
  string connector_id = 2;
  asker.v1.DocType type = 3;
  string title = 4;
  // Snippet with query-term highlights wrapped in <hi>...</hi>.
  string snippet = 5;
  double score = 6;
  google.protobuf.Timestamp created = 7;
  google.protobuf.Timestamp modified = 8;
  map<string, string> metadata = 9;
  // Media fields (M3), set for IMAGE/AUDIO/VIDEO hits. For audio/video, the
  // matched transcript chunk's offset so the UI deep-links to the moment;
  // zero for the whole-document / non-media case.
  int64 start_ms = 10;
  int64 end_ms = 11;
  // Which arm matched this chunk: "text" | "ocr" | "asr" | "caption".
  string modality = 12;
  // Blob key of a thumbnail / poster frame to render (empty if none).
  string thumbnail_key = 13;
  // explanation is a short, human-readable reason this hit ranked where it did
  // (v3 personalization), e.g. "deadline in 2 days · from Sarah (important)".
  // Empty when personalization is not active for the request. Surfaced to the
  // user for trust (Peak-End / transparency) and for debugging the ranker.
  string explanation = 14;
  // features carries each scoring term's signed contribution to the final rank
  // (semantic/preference/behavioral/attention/repetition), populated only when
  // SearchRequest.debug is set. Reproducibility surface for the ranker.
  map<string, double> features = 15;
}
