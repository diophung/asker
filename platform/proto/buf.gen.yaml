version: v2
plugins:
  # protoc-gen-go and protoc-gen-go-grpc must be on PATH; `make tools`
  # installs both into ./bin.
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
  # Python bindings for the enrich worker (ADR-007). Remote buf plugins (no
  # local protoc needed); committed like the Go output.
  #
  # PIN THESE. An unpinned `remote:` resolves to whatever the latest plugin is
  # at generate time, so the committed output drifts on its own and CI's
  # generated-code check fails on unrelated PRs (a new plugin release bumped
  # the "Protobuf Python Version" stamp from 7.35.1 to 7.36.1). The local Go
  # plugins were already pinned via the Makefile; these are the two inputs
  # that were not. v35.1 reproduces the committed output byte for byte.
  # Bump deliberately, together with a `make proto` commit.
  - remote: buf.build/protocolbuffers/python:v35.1
    out: gen/python
  - remote: buf.build/protocolbuffers/pyi:v35.1
    out: gen/python
